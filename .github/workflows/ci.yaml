name: Pipeline de Integración Continua (CI)

on:
  push:
    branches: [ main ]  # Se activa cada vez que subes código a 'main'

jobs:
  build-and-test:
    runs-on: ubuntu-latest  # Usa una máquina Linux de GitHub

    services:
      # Enciende una base de datos Postgres temporal en la nube para probar
      postgres_db:
        image: postgres:15-alpine
        env:
          POSTGRES_USER: test_user
          POSTGRES_PASSWORD: test_password
          POSTGRES_DB: test_db
        ports:
          - 5432:5432

    steps:
    - name: Descargar código del repositorio
      uses: actions/checkout@v3

     Tarjeta 2: Configurar Python
    - name: Configurar Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.11'

    - name: Instalar dependencias
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install pytest httpx  # Librerías para probar

    - name: Ejecutar Pruebas Automatizadas
      env:
        DATABASE_URL: postgresql://test_user:test_password@localhost:5432/test_db
      run: |
        pytest  # Ejecuta los tests automáticamente