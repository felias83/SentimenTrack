services:
  # Servicio 1: La Base de Datos
  postgres_db:
    image: postgres:15-alpine
    container_name: sentimentrack_db
    environment:
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${DB_NAME}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER} -d sentimentrack"]
      interval: 5s
      timeout: 5s
      retries: 5

  # Servicio 2: El Backend con IA
  api:
    build:
      context: .
      dockerfile: Dockerfile.api
    container_name: sentimentrack_api
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=postgresql://${DB_USER}:${DB_PASSWORD}@postgres_db:5432/${DB_NAME}
    depends_on:
      postgres_db:
        condition: service_healthy

  # Servicio 3: El Frontend Dashboard
  dashboard:
    build:
      context: .
      dockerfile: Dockerfile.dashboard
    container_name: sentimentrack_dashboard
    ports:
      - "8501:8501"
    environment:
      - API_URL=http://api:8000/comentarios
    depends_on:
      - api
      # Servicio 4: Ingestador Continuo de Datos
  ingestador:
    build:
      context: .
      dockerfile: Dockerfile.ingestador
    container_name: sentimentrack_ingestador
    depends_on:
      - api

volumes:
  postgres_data: